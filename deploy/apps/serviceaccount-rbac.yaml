# ServiceAccount + Role/RoleBinding for the workload simulator pods (design.md §5's
# "demand injection": each pod watches ConfigMap gpu-lease-demand in its own namespace
# via internal/workload.DemandWatcher). Shared by both app-a and app-b -- the watch is
# read-only and namespace-scoped, so one identity for the whole namespace is simplest
# and avoids duplicating this Role per app.
#
# Deliberately NOT bound to `default`: workload pods get their own least-privilege
# identity rather than inheriting whatever the namespace's default ServiceAccount may
# be granted elsewhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-lease-workload
  namespace: gpu-lease-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-lease-workload-demand-reader
  namespace: gpu-lease-poc
rules:
  # get/list/watch (no write verbs): the workload simulator only ever reads
  # ConfigMap gpu-lease-demand, it never creates or mutates it (design.md §5).
  # Not restricted to resourceNames=["gpu-lease-demand"]: RBAC resourceNames cannot
  # scope list/watch requests (only get/update/patch/delete), so it would have no
  # effect on the list/watch calls DemandWatcher actually makes.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-lease-workload-demand-reader
  namespace: gpu-lease-poc
subjects:
  - kind: ServiceAccount
    name: gpu-lease-workload
    namespace: gpu-lease-poc
roleRef:
  kind: Role
  name: gpu-lease-workload-demand-reader
  apiGroup: rbac.authorization.k8s.io
