# This rule is not used by the project gpu-lease-scaffold itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the poc.llm-d.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gpu-lease-scaffold
    app.kubernetes.io/managed-by: kustomize
  name: gpulease-editor-role
rules:
- apiGroups:
  - poc.llm-d.ai
  resources:
  - gpuleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - poc.llm-d.ai
  resources:
  - gpuleases/status
  verbs:
  - get
