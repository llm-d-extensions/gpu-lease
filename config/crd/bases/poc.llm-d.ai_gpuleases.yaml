  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: gpuleases.poc.llm-d.ai
spec:
  group: poc.llm-d.ai
  names:
    kind: GPULease
    listKind: GPULeaseList
    plural: gpuleases
    singular: gpulease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.gpuID
      name: GPU
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.claimRef.name
