      type: string
    - jsonPath: .spec.deploymentRef.name
      name: Deployment
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPULease is the Schema for the gpuleases API. It is cluster-scoped: a GPU is a
          cluster-level resource, and the GPULease's name (<nodeName>-gpu-<gpuID>) is the unique
          key for the (node, gpuID) pair it represents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GPULeaseSpec defines the desired state of GPULease.

              A GPULease represents the exclusive right for the pod in ClaimRef, which must already
              be running on NodeName, to use GPU index GPUID on that node. The pair (NodeName, GPUID)
              is encoded in the GPULease's name (see LeaseName in names.go), which makes etcd the
              mutual-exclusion mechanism for the pair.
            properties:
              claimRef:
                description: ClaimRef is the pod that must run on NodeName and receives
                  the lease.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  namespace:
                    description: Namespace of the referenced object.
                    type: string
                  uid:
                    description: |-
                      UID of the referenced object, when known. Used to detect the object having been
                      replaced (e.g. pod recreated with the same name).
                    type: string
                required:
                - name
                - namespace
                type: object
              deploymentRef:
                description: DeploymentRef is the Deployment that owns the claiming
                  pod.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  namespace:
                    description: Namespace of the referenced object.
                    type: string
                  uid:
                    description: |-
                      UID of the referenced object, when known. Used to detect the object having been
                      replaced (e.g. pod recreated with the same name).
                    type: string
                required:
                - name
                - namespace
                type: object
              gpuID:
                description: GPUID is the index of the GPU on NodeName, in [0, node's
                  poc.llm-d.ai/gpu-count).
                format: int32
                minimum: 0
                type: integer
              gpuModel:
                description: |-
                  GPUModel is informational, copied from the node's poc.llm-d.ai/gpu-model label at
                  creation time.
                type: string
              localQueueName:
                description: LocalQueueName is the Kueue LocalQueue that the backing
                  Workload is submitted to.
                type: string
              nodeName:
                description: NodeName is the node that owns GPUID and that ClaimRef's
                  pod must be running on.
                type: string
            required:
            - claimRef
            - deploymentRef
            - gpuID
            - localQueueName
            - nodeName
            type: object
          status:
            description: GPULeaseStatus defines the observed state of GPULease.
            properties:
              admittedAt:
                description: AdmittedAt is when the backing Workload's Admitted condition
                  became True.
                format: date-time
                type: string
              boundAt:
                description: BoundAt is when the pod first reported state "hot" for
                  this lease.
                format: date-time
                type: string
              conditions:
                description: Conditions holds the QuotaReserved, PodActivated and
                  Ready conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
